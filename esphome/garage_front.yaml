substitutions:
  board: esp01_1m
  name: garagefront
  friendly_name: Garage Front
  follow_this: light.garage_garage_back_garage_back_light
  this_light: light_1
  num_hlpr_minutes: input_number.garage_delay_minutes

packages:
  device_base: !include /config/esphome/packages/sg_8266_base.yaml
  follow_state: !include /config/esphome/packages/follow_state.yaml
  light_auto_off: !include /config/esphome/packages/timed_auto_off.yaml

esphome:
  area: Garage
  name_add_mac_suffix: false

wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: !secret garage_front_IP
    dns1: !secret chaloupkaabode_gateway

status_led:
  pin:
    number: GPIO13
    inverted: true

output:
  - platform: gpio
    pin: GPIO12
    id: relay_1

light:
  - platform: binary
    name: "${friendly_name} Light"
    id: light_1
    output: relay_1
    on_turn_on:
      - script.execute: light_auto_off
    on_turn_off:
      - homeassistant.action:
          action: script.turn_on
          data:
            entity_id: script.garage_chill
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  - platform: gpio
    id: button_1
    name: "${friendly_name} Switch"
    icon: "mdi:light-switch"
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - light.turn_on: light_1



      
