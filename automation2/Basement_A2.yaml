---
#####################################################
# Dust Collector                                    #
#####################################################
- id: 33b1583b-dde3-4228-9c88-a0d457ddac6a
  mode: single
  max_exceeded: silent
  alias: Dust Collector button turn on or off via button
  initial_state: on
  triggers:
    - trigger: state
      entity_id: button.dust_collector_button1_2
      from: "off"
      to: "on"
  actions:
    - action: switch.toggle
      entity_id: switch.basement_dust_collector_dust_collector_relay
    - delay: 00:00:03


####################################################
# Laundry                                          #
####################################################
- id: 92312f77-02af-4a49-a728-978ff6b08229
  alias: Dryer Status
  initial_state: on
  triggers:
    - trigger: state
      entity_id: binary_sensor.dryer_running
      from: "on"
      to: "off"
      for:
        seconds: 30
  actions:
    - action: script.tts_dryer_done
  mode: single
  max_exceeded: silent

- id: 924088c3-c0e6-4d59-bebf-6442c522381b
  alias: Washer Status
  description: Announce when washer is done
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.washer_running_2
      from: "on"
      to: "off"
      for:
        seconds: 20
  conditions:
  actions:
    - action: script.tts_wash_machine_done
  mode: single
  max_exceeded: silent

- id: adb7ce4b-324f-4c17-a519-758e42f2166e
  alias: Wash Machine Dryer Daily Reboot
  initial_state: on
  triggers:
    trigger: time
    at: 04:49:12
  actions:
    - action: mqtt.publish
      data:
        topic: wash_machine/cmnd/restart
        payload: "1"
  mode: single
  max_exceeded: silent

