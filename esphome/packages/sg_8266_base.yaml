# The stuff I need in all my espHome devices. 
# I reserve the right to overwrite any at any time.
# Path to file: esphome/packages/sg_base.yaml

substitutions:
  name: chaloupkaabode-esphome
  friendly_name: Another Brick in the Wall
  frame_type: esp-idf
  model: not specified

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "chaloupkaabode.${name}"
    version: "1.0.0"
  comment: "Base hardware: ${model}"

esp8266:
  board: ${board}
  framework:
    version: latest
  early_pin_init: false
  restore_from_flash: true

  # Enable logging
logger:

  # Enable Home Assistant API
api:
  encryption:
    key: !secret chaloupkaabode_encrypt

ota:
  - platform: esphome
    encryption:

wifi:
  phy_mode: 11G
  networks:
    - id: main_house_ap
      ssid: !secret chaloupkaabode_wifi_ssid
      password: !secret chaloupkaabode_wifi_password
    - id: second_house_ap
      ssid: !secret chaloupkaabode_wifi2_ssid
      password: !secret chaloupkaabode_wifi_password
  ap:
    ssid: "${name} Fallback"
    password: !secret ap_password

web_server:
  port: 80

time:
  # Sync time with HA
  - platform: homeassistant
    id: time_homeassistant
    timezone: "America/Chicago"
    on_time_sync:
      - component.update: sensor_uptime_timestamp

text_sensor:
  # IP Address 
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      icon: mdi:wifi
      entity_category: diagnostic

  # version info
  - platform: version
    name: "${friendly_name}_version"
    entity_category: diagnostic

# Sensors with general information.
sensor:
  # Uptime sensor (internal only).
  - platform: uptime
    id: sensor_uptime
    entity_category: diagnostic
    
  # Uptime timestamp
  - platform: template
    id: sensor_uptime_timestamp
    name: "Uptime"
    device_class: "timestamp"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      static float timestamp = (
        id(time_homeassistant).utcnow().timestamp - id(sensor_uptime).state
      );
      return timestamp;
    entity_category: diagnostic

  # WiFi Signal sensor.
  - platform: wifi_signal
    name: WiFi Signal
    icon: mdi:wifi-strength-2
    update_interval: 228s
    entity_category: diagnostic

  # VCC Sensor
  - platform: adc
    pin: VCC
    name: "${friendly_name} VCC Voltage"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"
    entity_category: diagnostic

button:
  - platform: safe_mode
    name: "Safe Mode Boot ${name} ${friendly_name}"
    entity_category: diagnostic

  - platform: restart
    name: "Restart ${name} ${friendly_name}"
    entity_category: diagnostic
