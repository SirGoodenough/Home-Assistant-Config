substitutions:
  name: backporchlight
  friendly_name: Back Porch Light
  board: esp8285
  follow_this: light.garage_garage_top_garage_top_light
  this_light: light_1
  num_hlpr_minutes: input_number.outside_delay_minutes
  bool_dark_sensor: binary_sensor.dark_outside

packages:
  device_base: !include /config/esphome/packages/sg_8266_base.yaml
  follow_state: !include /config/esphome/packages/follow_state.yaml
  light_auto_off: !include /config/esphome/packages/timed_auto_off.yaml
  check_dark_out: !include /config/esphome/packages/check_dark_out.yaml

esphome:
  area: Outside
  name_add_mac_suffix: False

wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: !secret back_porch_IP
    dns1: !secret chaloupkaabode_gateway

status_led:
  pin:
    number: GPIO13
    inverted: true

output:
  - platform: gpio
    pin: GPIO12
    id: relay_1

light:
  - platform: binary
    name: "${friendly_name} Light"
    id: light_1
    output: relay_1
    on_turn_on:
      - if:
          condition:
            lambda: return id(dark_outside).state != "off";
          then:
            - script.execute: light_auto_off
          else:
            - light.turn_off: light_1
    on_turn_off:
      - homeassistant.action:
          action: script.turn_on
          data:
            # Reset the delay to default value when the light is turned off.
            entity_id: script.outside_chill
    restore_mode: RESTORE_DEFAULT_ON

script:
  - id: light_1_auto_off
    mode: restart
    then:
      - delay: !lambda |-
          const float minutes = id(outside_delay_minutes).state;
          if (isnan(minutes) || minutes <= 0.0f) {
            return 8UL * 60UL * 1000UL;
          }
          return static_cast<uint32_t>(minutes * 60.0f * 1000.0f);
      - light.turn_off: light_1

sensor:
  - platform: homeassistant
    id: outside_delay_minutes
    entity_id: input_number.outside_delay_minutes
    internal: true
    on_value:
      - logger.log:
          level: INFO
          format: "Outside delay minutes: %.1f"
          args: ["x"]

binary_sensor:
  - platform: gpio
    id: button_1
    name: "${friendly_name} Switch"
    icon: "mdi:light-switch"
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - light.turn_on: light_1

text_sensor:
  - platform: homeassistant
    id: dark_outside
    entity_id: binary_sensor.dark_outside
    internal: true

