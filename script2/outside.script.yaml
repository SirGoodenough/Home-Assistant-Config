---
#####################################################
# Outside Lights Party Mode                         #
#####################################################
party_time:
  alias: Party Time
  sequence:
    - action: input_number.set_value
      entity_id:
        - input_number.outside_delay_minutes
      data:
        value: 612.6
    - action: light.turn_on
      metadata: {}
      target:
        label_id: outside_lights
      data: {}

#####################################################
# Outside & Garage Lights Chill Mode                #
#####################################################
chill_time:
  alias: Chill Time
  sequence:
    - alias: Outside Lights to normal mode
      action: script.outside_chill
    - alias: Garage Lights to normal mode
      action: script.garage_chill

outside_chill:
  alias: Outside Chill
  sequence:
    - alias: Outside Lights to normal mode
      action: input_number.set_value
      entity_id:
        - input_number.outside_delay_minutes
      data:
        value: 7.2
    - alias: All outside building Lights off
      action: light.turn_off
      metadata: {}
      target:
        label_id: outside_lights
      data: {}

garage_chill:
  alias: Garage Chill
  sequence:
    - alias: Garage Lights to normal mode
      action: input_number.set_value
      entity_id:
        - input_number.garage_delay_minutes
      data:
        value: 12.8
    - alias: All inside building Lights off
      action: light.turn_off
      metadata: {}
      target:
        label_id: garage_lights
      data: {}
