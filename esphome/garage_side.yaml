substitutions:
  board: esp8285
  name: garageside
  friendly_name: Garage Side
  follow_this: light.garage_garage_top_garage_top_light
  this_thing: light_1
  num_hlpr_minutes: input_number.outside_delay_minutes
  bool_dark_sensor: binary_sensor.dark_outside
  model: Some no name wall switch from DrZzs

packages:
  device_base: !include packages/sg_8266_base.yaml
  follow_state: !include packages/follow_state.yaml
  light_auto_off: !include packages/timed_auto_off.yaml
  check_dark_out: !include packages/check_dark_out.yaml

esphome:
  area: Outside
  name_add_mac_suffix: false

wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: !secret garage_side_IP
    dns1: !secret chaloupkaabode_gateway

status_led:
  pin:
    number: GPIO13
    inverted: true

output:
  - platform: gpio
    pin: GPIO12
    id: relay_1

light:
  - platform: binary
    name: "${friendly_name} Light"
    id: light_1
    output: relay_1
    on_turn_on:
      - if:
          condition:
            lambda: return id(dark_outside).state != "off";
          then:
            - script.execute: light_auto_off
          else:
            - light.turn_off: light_1
    on_turn_off:
      - homeassistant.action:
          action: script.turn_on
          data:
            # Reset the delay to default value when the light is turned off.
            entity_id: script.outside_chill
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  - platform: gpio
    id: button_1
    name: "${friendly_name} Switch"
    icon: "mdi:light-switch"
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - light.turn_on: light_1
