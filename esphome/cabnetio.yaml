substitutions:
  board: esp01_1m
  area: kitchen
  IP: !secret cabnetio_IP
  name: cabnetio
  friendly_name: Cabnetio
  model: Sonoff basic

packages:
  device_base: !include packages/sg_8266_base.yaml

esphome:
  area:
    id: ${area}
    name: ${area}
  name_add_mac_suffix: false
  devices:
    - id: light_device
      name: "${friendly_name} Counter"
      area_id: ${area}

wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: ${IP}
    dns1: !secret chaloupkaabode_gateway

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      mode:
        input: true
        pullup: true
      inverted: true
    id: button_1
    name: "${friendly_name} Button"
    on_press:
      then:
        - light.toggle: light_1

output:
  - platform: gpio
    pin: GPIO12
    id: relay_1

light:
  - platform: binary
    name: "${friendly_name} Light"
    id: light_1
    output: relay_1
    restore_mode: RESTORE_DEFAULT_OFF
    device_id: light_device

status_led:
  pin:
    number: GPIO13
    inverted: yes