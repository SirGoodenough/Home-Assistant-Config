substitutions:
  board: esp01_1m
  name: garagedoor
  area: Garage
  IP: !secret garage_door_IP
  friendly_name: Garage Door
  update_interval: 207s
  model: Sonoff SV

packages:
  device_base: !include packages/sg_8266_base.yaml

esphome:
  area:
    id: ${area}
    name: ${area}
  name_add_mac_suffix: false
  devices:
    - id: cover_device
      name: "${friendly_name}"
      area_id: ${area}
    - id: pir_device
      name: "${friendly_name}"
      area_id: Outside

wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: ${IP}
    dns1: !secret chaloupkaabode_gateway

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "${friendly_name} Button1"
    on_press:
      - cover.toggle: garage_cover

  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT
      inverted: true
    name: "${friendly_name} PIR_Button"
    filters:
      - delayed_on: 10ms
    on_press:
      - switch.turn_on: pir
    device_class: motion
    icon: "mdi:motion-sensor"

output:
  - platform: gpio
    pin: GPIO12
    id: relay1_output

  - platform: gpio
    pin: GPIO4
    id: pir_output

cover:
  - platform: template
    name: "${friendly_name} Overhead"
    id: garage_cover
    icon: "mdi:garage"
    optimistic: true
    assumed_state: true
    open_action:
      - script.execute: pulse_garage_door
    close_action:
      - script.execute: pulse_garage_door

switch:
  - platform: output
    name: "${friendly_name} Outside PIR"
    icon: "mdi:motion-sensor"
    id: pir
    output: pir_output
    on_turn_on:
      - homeassistant.action:
          action: script.turn_on
          data:
            entity_id: script.outside_lights_on
      - delay: 500ms
      - switch.turn_off: pir
    restore_mode: ALWAYS_OFF

script:
  - id: pulse_garage_door
    then:
      - output.turn_on: relay1_output
      - delay: 500ms
      - output.turn_off: relay1_output

status_led:
  pin:
    number: GPIO13

sensor:
  - platform: dht
    model: Si7021
    pin: GPIO14
    humidity:
      name: "${friendly_name} Humidity"
      id: humidity
      state_class: measurement
    temperature:
      name: "${friendly_name} Temperature"
      id: temperature
      state_class: measurement
    update_interval: ${update_interval}

  - platform: dew_point
    name: "${friendly_name} Dew Point"
    temperature: temperature
    humidity: humidity
    state_class: measurement
