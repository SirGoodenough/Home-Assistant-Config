- triggers:
    - trigger: event
      event_type: esphome.rf_code_received
    - trigger: event
      event_type: rf_bridge_code_received
    - trigger: event
      event_type: rf_battery_low_sensors_reset
      id: reset
  binary_sensor:
    - name: "RF Event Battery Low Mailbox"
      unique_id: rf_event_battery_low_mailbox
      device_class: battery
      state: >-
        {% set rf_code = trigger.event.data.get('code', '') | string | lower | replace('0x', '') | regex_replace('^0+', '') %}
        {{ false if trigger.id == 'reset' else rf_code in ['2b2006'] or this.state == 'on' }}

