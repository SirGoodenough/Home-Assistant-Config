- switch:
    - name: "Outside Christmas"
      unique_id: 526b34ec-7e20-4d88-8a78-07a16ef84029
      icon: mdi:candycane
      state: "{{ is_state('binary_sensor.rf_event_out_christmas', 'on') }}"
      turn_on:
        - action: esphome.rfbridge2_send_rf_code
          data:
            sync: 9540
            low: 310
            high: 920
            code: 0xB94183
      turn_off:
