- id: 0ca61a92-7c41-4277-9919-c0a9a8f8f0b9
        # input_number.humidifer_duty_cycle_seconds
  alias: Humidifier Proportional Control
  description: Modulate the water flow to the Furnace Humidifer.
  trace:
    stored_traces: 10
  use_blueprint:
    path: SirGoodenough/HumidifierWaterThrottleControlInputNumber.yaml
    input:
      input_num_helper: input_number.humidifer_duty_cycle_seconds
      humidifier: humidifier.chaloupkaabode_humidifier
      humidity: sensor.house_humidity_group
      power_1: switch.house_humidifier_house_humidifier_water_enable
      scalar: 2.8
