substitutions:
  name: georgefan
  friendly_name: George
  area: Jennys_Room
  IP: !secret george_IP
  board: esp8285
  comment: IFAN04 

# PULL-INS FROM LINKS BELOW
  devicename: ${name}
  friendly_devicename: ${friendly_name}
  
  fan_startup_boost_time: 5s

  # Morse codes for the different buzzer sounds
  code_buzzer_on:  "E"    # .
  code_buzzer_off: "I"    # ..
  code_fan_off:    "T"    # -
  code_fan_1:      "N"    # -.
  code_fan_2:      "D"    # -..
  code_fan_3:      "B"    # -...
  code_rc_unpair:  "O"    # ---
  code_short:      "E"    # .
  code_long:       "T"    # -

packages:
  device_base: !include packages/sg_8266_base.yaml
  ifan04: !include packages/rh1rich.main_adv_buzzer.yaml.yaml
  # MOVED IT LOCAL TO CONTROL THE DEVICE NAMING AND AREA  (Only change)
    # url: https://github.com/rh1rich/esphome-ifan04
    # files:
    #   - main_adv_buzzer.yaml

esphome:
  area:
    id: ${area}
    name: ${area}
  name_add_mac_suffix: false
  devices:
    - id: light_device
      name: "${friendly_name} Light"
      area_id: ${area}
    - id: fan_device
      name: "${friendly_name} Fan"
      area_id: ${area}

wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: ${IP}
    dns1: !secret chaloupkaabode_gateway


# PULLED FROM A GIT PACKAGE HERE:  https://github.com/rh1rich/esphome-ifan04/blob/main/main_adv_buzzer.yaml
