substitutions:
  name: bmtdownstairway
  friendly_name: Basement Stair down Light
  area: Outside
  IP: !secret bmt_stair_down_IP
  board: esp8285
  model: Sonoff Slampher
  follow_this: light.basement_basement_stair_up_light_basement_stair_up_light_light
  this_thing: light_1
  num_hlpr_minutes: input_number.stair_delay_minutes

packages:
  device_base: !include packages/sg_8266_base.yaml
  follow_state: !include packages/follow_state.yaml
  light_auto_off: !include packages/timed_auto_off.yaml

esphome:
  area:
    id: ${area}
    name: ${area}
  name_add_mac_suffix: false
  devices:
    - id: light_device
      name: "${friendly_name} Dn Bmt Stairway"
      area_id: ${area}

wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: ${IP}
    dns1: !secret chaloupkaabode_gateway

status_led:
  pin:
    number: GPIO13
    inverted: true

output:
  - platform: gpio
    pin: GPIO12
    id: relay_1

light:
  - platform: binary
    name: "${friendly_name} Light"
    id: light_1
    output: relay_1
    on_turn_on:
      - script.execute: light_auto_off
    on_turn_off:
      - light.turn_off: light_1
    restore_mode: RESTORE_DEFAULT_ON
    device_id: light_device

binary_sensor:
  - platform: gpio
    id: button_1
    name: "${friendly_name} Switch"
    icon: "mdi:light-switch"
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - light.turn_on: light_1
