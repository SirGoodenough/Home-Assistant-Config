  initial_state: on
  triggers:
    - trigger: state
      entity_id: binary_sensor.rf_event_office_light_1
      to: "on"
  actions:
    - action: light.toggle
      metadata: {}
      target:
        label_id: mom_office
      data: {}
  mode: single

