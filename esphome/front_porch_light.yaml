substitutions:
  name: frontporchlight
  friendly_name: Front Porch Light
  area: Outside
  IP: !secret front_porch_IP
  board: esp8285
  this_light: light_1
  num_hlpr_minutes: input_number.outside_delay_minutes
  bool_dark_sensor: binary_sensor.dark_outside
  model: Sonoff Slampher

packages:
  device_base: !include packages/sg_8266_base.yaml
  light_auto_off: !include packages/timed_light_auto_off.yaml
  check_dark_out: !include packages/check_dark_out.yaml

esphome:
  area:
    id: ${area}
    name: ${area}
  name_add_mac_suffix: false
  devices:
    - id: light_device
      name: "${friendly_name} Up Stairway"
      area_id: ${area}

wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: ${IP}
    dns1: !secret chaloupkaabode_gateway

status_led:
  pin:
    number: GPIO13
    inverted: true

output:
  - platform: gpio
    pin: GPIO12
    id: relay_1

light:
  - platform: binary
    name: "${friendly_name} Light"
    id: light_1
    output: relay_1
    on_turn_on:
      - if:
          condition:
            lambda: return id(dark_outside).state != "off";
          then:
            - script.execute: light_auto_off
          else:
            - light.turn_off: light_1
    restore_mode: RESTORE_DEFAULT_ON
    device_id: light_device

binary_sensor:
  - platform: gpio
    id: button_1
    name: "${friendly_name} Switch"
    icon: "mdi:light-switch"
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - light.turn_on: light_1
