---
#####################################################
# Outside Lights Party Mode                         #
#####################################################
party_time:
  alias: Party Time
  sequence:
    - action: input_number.set_value
      entity_id:
        - input_number.outside_delay_minutes
      data:
        value: 612.6
    - action: script.outside_lights_on

#####################################################
# Outside & Garage Lights Chill Mode                #
#####################################################
chill_time:
  alias: Chill Time
  sequence:
    - alias: Lights to normal mode
      action: script.outside_chill
    - action: script.garage_chill
    - alias: All out building Lights off
      action: script.outside_lights_off
    - action: script.garage_lights_off

outside_chill:
  alias: Outside Chill
  sequence:
    - alias: Outside Lights to normal mode
      action: input_number.set_value
      entity_id:
        - input_number.outside_delay_minutes
      data:
        value: 7.2

garage_chill:
  alias: Garage Chill
  sequence:
    - alias: Garage Lights to normal mode
      action: input_number.set_value
      entity_id:
        - input_number.garage_delay_minutes
      data:
        value: 12.8

#####################################################
# General Light Control                             #
#####################################################
outside_lights_on:
  alias: Garage Outside Lights On
  sequence:
    - action: light.turn_on
      metadata: {}
      target:
        label_id: outside_lights

outside_lights_off:
  alias: Garage Outside Lights Off
  sequence:
    - action: light.turn_off
      metadata: {}
      target:
        label_id: outside_lights
