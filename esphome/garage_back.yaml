substitutions:
  board: esp01_1m
  name: garageback
  friendly_name: Garage Back
  follow_this: light.garage_garage_back_garage_back_light
  follow_light: light_1

packages:
  device_base: !include /config/esphome/packages/sg_8266_base.yaml
  follow_state: !include /config/esphome/packages/follow_state.yaml


esphome:
  area: Garage
  name_add_mac_suffix: false

wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: !secret garage_back_IP
    dns1: !secret chaloupkaabode_gateway

status_led:
  pin:
    number: GPIO13
    inverted: true

output:
  - platform: gpio
    pin: GPIO12
    id: relay_1

light:
  - platform: binary
    name: "${friendly_name} Light"
    id: light_1
    output: relay_1
    on_turn_off:
      - homeassistant.action:
          action: script.turn_on
          data:
            entity_id: script.garage_chill
    restore_mode: RESTORE_DEFAULT_ON

script:
  - id: light_1_auto_off
    mode: restart
    then:
      - delay: !lambda |-
          const float minutes = id(garage_delay_minutes).state;
          if (isnan(minutes) || minutes <= 0.0f) {
            return 8UL * 60UL * 1000UL;
          }
          return static_cast<uint32_t>(minutes * 60.0f * 1000.0f);
      - light.turn_off: light_1

sensor:
  - platform: homeassistant
    id: garage_delay_minutes
    entity_id: input_number.garage_delay_minutes
    internal: true
    on_value:
      - logger.log:
          level: INFO
          format: "Garage delay minutes: %.1f"
          args: ["x"]

binary_sensor:
  - platform: gpio
    id: button_1
    name: "${friendly_name} Switch"
    icon: "mdi:light-switch"
    pin:
      number: GPIO14
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - light.turn_on: light_1

