substitutions:
  name: bmtdownstairway
  friendly_name: Basement Stair down Light
  area: Outside
  IP: !secret bmt_stair_down_IP
  board: esp8285
  model: Sonoff Slampher

packages:
  device_base: !include packages/sg_8266_base.yaml

esphome:
  area: Basement
  name_add_mac_suffix: false

wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: ${IP}
    dns1: !secret chaloupkaabode_gateway

status_led:
  pin:
    number: GPIO13
    inverted: true

output:
  - platform: gpio
    pin: GPIO12
    id: relay_1_gpio

  - platform: template
    type: binary
    id: relay_1
    write_action:
      - if:
          condition:
            and:
              - lambda: return id(dark_outside).state != "off";
              - lambda: return state;
          then:
            - output.turn_on: relay_1_gpio
          else:
            - output.turn_off: relay_1_gpio


sensor:
  - platform: homeassistant
    id: stair_delay_minutes
    entity_id: input_number.stair_delay_minutes
    internal: true
    on_value:
      - logger.log:
          level: INFO
          format: "Stair delay minutes: %.1f"
          args: ["x"]

binary_sensor:
  - platform: gpio
    id: button_1
    name: "${friendly_name} Switch"
    icon: "mdi:light-switch"
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - light.turn_on: light_1

text_sensor:
  - platform: homeassistant
    id: dark_outside
    entity_id: binary_sensor.dark_outside
    internal: true

  - platform: homeassistant
    id: light_state
    entity_id: light.basement_basement_stair_up_light_basement_stair_up_light_light
    internal: true
    on_value:
      - if:
          condition:
            lambda: return x == "on";
          then:
            - light.turn_on: light_1
          else:
            - if:
                condition:
                  lambda: return x == "off";
                then:
                  - light.turn_off: light_1
