# Porch / Hall Lights                              #
####################################################
- id: d84904da-2592-42d8-abdd-e453ea1640ab
  alias: Trigger Front Porch Light
  initial_state: on
  triggers:
    - trigger: state
      entity_id: binary_sensor.rf_event_frontdoori
      to: "on"
  actions:
    - action: light.turn_on
      entity_id: light.outside_front_porch_light_front_porch_light_light

- id: 2635151e-3fbb-4fe5-b00c-55b9a0393753
