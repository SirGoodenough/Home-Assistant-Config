substitutions:
  name: stairway
  friendly_name: Stair Light
  board: esp8285

packages:
  device_base: !include packages/sg_8266_base.yaml

esphome:
  area: Upstairs
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(button1_enabled) = true;
          id(stair_delay_minutes_saved) = id(stair_delay_minutes).state;

wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: !secret stairway_IP
    dns1: !secret chaloupkaabode_gateway

globals:
  - id: button1_enabled
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  - platform: gpio
    id: relay1
    name: "Light"
    icon: "mdi:lightbulb-night-outline"
    pin: GPIO12
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: |-
          id(button1_enabled) = false;
      - script.execute: relay1_auto_off
    on_turn_off:
      - lambda: |-
          id(button1_enabled) = id(dark_outside).state;

script:
  - id: relay1_auto_off
    mode: restart
    then:
      - delay: !lambda |-
          const float minutes = id(stair_delay_minutes_saved);
          if (isnan(minutes) || minutes <= 0.0f) {
            return 8UL * 60UL * 1000UL;
          }
          return static_cast<uint32_t>(minutes * 60.0f * 1000.0f);
      - switch.turn_off: relay1
  - id: press_button1
    then:
      - if:
          condition:
            lambda: return id(button1_enabled);
          then:
            - switch.toggle: relay1

sensor:
  - platform: homeassistant
    id: stair_delay_minutes
    entity_id: input_number.stair_delay_minutes
    internal: true

text_sensor:
  - platform: homeassistant
    id: dark_outside_state
    entity_id: binary_sensor.dark_outside
    internal: true
    on_value:
      - binary_sensor.template.publish:
          id: dark_outside
          state: !lambda 'return x != "off";'




status_led:
  pin:
    number: GPIO13
    inverted: true

output:
  - platform: gpio
    pin: GPIO12
    id: relay_1

light:
  - platform: binary
    name: "${friendly_name} Light"
    id: light_1
    output: relay_1
    on_turn_on:
      - if:
          condition:
            lambda: return id(dark_outside).state != "off";
          then:
            - script.execute: light_auto_off
          else:
            - light.turn_off: light_1
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  - platform: gpio
    id: button_1
    name: "${friendly_name} Switch"
    icon: "mdi:light-switch"
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - light.turn_on: light_1
