substitutions:
  name: testkitchen
  friendly_name: Gosund for testing
  area: Kitchen
  board: esp01_1m
  model: Gosund WP3 outlet

packages:
  device_base: !include packages/sg_8266_base.yaml

esphome:
  area:
    id: ${area}
    name: ${area}
  name_add_mac_suffix: false
  devices:
    - id: switch_device
      name: "${friendly_name} GoSund Outlet"
      area_id: ${area}

wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: !secret kitchen_IP
    dns1: !secret chaloupkaabode_gateway

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    name: "${friendly_name} Button"
    on_click:
      - min_length: 50ms
        max_length: 350ms
        then:
          - switch.toggle:
              id: relay
      - min_length: 500ms
        max_length: 10s
        then:
          - homeassistant.action:
              action: light.toggle
              data:
                entity_id: light.grp_kitch

output:
  - platform: gpio
    pin: GPIO14
    id: relay_output
  - platform: gpio
    pin:
      number: GPIO12
      inverted: true
    id: led_1

light:
  - platform: binary
    name: "${friendly_name} LED 1"
    output: led_1

switch:
  - platform: output
    output: relay_output
    id: relay
    name: "${friendly_name} Relay"
    icon: mdi:power-socket-us
    restore_mode: RESTORE_DEFAULT_OFF
    device_class: outlet
    device_id: switch_device

status_led:
  pin:
    number: GPIO13
    inverted: true
