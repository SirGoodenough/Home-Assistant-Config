substitutions:
  name: stairway
  friendly_name: Stair Light
  board: esp8285
  this_light: light_1
  num_hlpr_minutes: input_number.outside_delay_minutes
  bool_dark_sensor: binary_sensor.dark_outside
  model: Sonodd Slampher

packages:
  device_base: !include packages/sg_8266_base.yaml
  light_auto_off: !include packages/timed_auto_off.yaml
  check_dark_out: !include packages/check_dark_out.yaml

esphome:
  area: Upstairs
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(button1_enabled) = true;
wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: !secret stairway_IP
    dns1: !secret chaloupkaabode_gateway

status_led:
  pin:
    number: GPIO13
    inverted: true

globals:
  - id: button1_enabled
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  - platform: gpio
    id: relay1
    name: "Light"
    icon: "mdi:lightbulb-night-outline"
    pin: GPIO12
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: |-
          id(button1_enabled) = false;
      - script.execute: relay1_auto_off
    on_turn_off:
      - lambda: |-
          id(button1_enabled) = id(dark_outside).state;

script:
  - id: press_button1
    then:
      - if:
          condition:
            lambda: return id(button1_enabled);
          then:
            - switch.toggle: relay1

binary_sensor:
  - platform: gpio
    id: button1
    name: "Switch"
    icon: "mdi:light-switch"
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - script.execute: press_button1

output:
  - platform: gpio
    pin: GPIO12
    id: relay_1

light:
  - platform: binary
    name: "${friendly_name} Light"
    id: light_1
    output: relay_1
    on_turn_on:
      - if:
          condition:
            lambda: return id(dark_outside).state != "off";
          then:
            - script.execute: light_auto_off
          else:
            - light.turn_off: light_1
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  - platform: gpio
    id: button_1
    name: "${friendly_name} Switch"
    icon: "mdi:light-switch"
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - light.turn_on: light_1
