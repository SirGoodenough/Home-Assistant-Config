---
#####################################################
# Garage Moca Reset                                 #
#####################################################
reset_garage_serverroom_2:
  alias: Reset Garage Serverroom 2
  use_blueprint:
    path: SirGoodenough/device_reset.yaml
    input:
      target_entity:
        - switch.moca_reset
        - switch.moca_g
      time_off:
        hours: 0
        minutes: 2
        seconds: 21
        days: 0
  mode: single
  icon: mdi:garage

#####################################################
# Inner Garage Lights Work Mode                     #
#####################################################
work_time:
  alias: Work Time
  sequence:
    - action: input_number.set_value
      data:
        entity_id: input_number.garage_delay_minutes
        value: 182.7
    - action: script.garage_lights_on

#####################################################
# General Light Control                             #
#####################################################
garage_lights_on:
  alias: Garage Lights On
  sequence:
    - action: light.turn_on
      metadata: {}
      target:
        label_id: garage_lights

garage_lights_off:
  alias: Garage Lights Off
  sequence:
    - action: light.turn_off
      metadata: {}
      target:
        label_id: garage_lights
