substitutions:
  name: "ethernettest"
  friendly_name: Food C
  frame_type: esp-idf
  board: esp32dev
  model: A crappy ESP32 Dev board from DrZzs that mostly don't work

packages:
  device_base: !include packages/sg_base.yaml

wifi:
  manual_ip:
    gateway: !secret chaloupkaabode_gateway
    subnet: !secret chaloupkaabode_subnet
    static_ip: !secret ethernettest_IP
    dns1: !secret chaloupkaabode_gateway

esphome:
  area: kitchen
  name_add_mac_suffix: false

esp32_ble_tracker:

external_components:
  - source:
      type: git
      url: https://github.com/davidcoulson/esphome-ble-advert-filter
      ref: v2.0.3
    components: [ble_advert_filter]
# From https://community.home-assistant.io/t/ble-advert-filter-filter-ble-adverts-on-the-esphome-proxy-needs-esphome-2026-10/1029764?u=sir_goodenough

bluetooth_proxy:
  active: true

ble_advert_filter:
  rssi_threshold: -80

i2c:
  sda: 14
  scl: 13
  scan: true
  id: bus_a

sensor:
  - platform: scd30
    co2:
      name: "${friendly_name} CO2"
      accuracy_decimals: 1
    temperature:
      name: "${friendly_name} Temperature"
      accuracy_decimals: 1
    humidity:
      name: "${friendly_name} Humidity"
      accuracy_decimals: 1
      filters:
        - offset: -14.0
    temperature_offset: 1.8 °C
    address: 0x61
    update_interval: 68s

    # GP2Y1010AU0F sensor in the Keyestudio KS0196 PM2.5 Dust Sensor Module.
  - platform: gp2y1010au0f
    name: '${friendly_name} Indoor PM2.5'
    sensor: aq
    output: led
    update_interval: 58s

  - platform: adc
    internal: true
    name: "${friendly_name} Raw Dust"
    accuracy_decimals: 6
    unit_of_measurement: "volts"
    pin: 36
    id: aq

output:
    # GP2Y1010AU0F Sample LED in the Keyestudio KS0196 PM2.5 Dust Sensor Module.
  - platform: gpio
    pin:
      number: 16
      inverted: true
    id: led
